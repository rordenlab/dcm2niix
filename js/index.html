<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dcm2niix WASM Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    #drop { margin: 1rem 0; padding: 2rem; border: 2px dashed #888; text-align: center; }
    #drop.over { background: #def; }
  </style>
</head>
<body>
  <h1>dcm2niix WASM Demo</h1>
  <input type="file" id="folder" webkitdirectory multiple>
  <div id="drop">or drop DICOM files/folders here</div>
  <progress id="progress" max="1" value="0"></progress>
  <button id="cancel" disabled>Cancel</button>
  <p id="status">Select or drop a DICOM folder.</p>
  <ul id="results"></ul>

  <script type="module">
    import { convert, filesFromDataTransfer } from './dist/index.jpeg.js';

    const $ = (id) => document.getElementById(id);
    let controller = null;
    let urls = [];

    async function run(files) {
      if (controller) return; // one conversion at a time
      controller = new AbortController();
      $('cancel').disabled = false;
      $('folder').disabled = true;
      for (const url of urls) URL.revokeObjectURL(url); // release the previous outputs
      urls = [];
      $('results').replaceChildren();
      $('status').textContent = `Converting ${files.length} file(s)…`;
      try {
        const { series, files: outputs, exitCode } = await convert(files, {
          args: ['-z', 'y'],
          signal: controller.signal,
          onProgress: (p) => ($('progress').value = p),
        });
        for (const file of outputs) {
          urls.push(URL.createObjectURL(file));
          const a = Object.assign(document.createElement('a'), { href: urls.at(-1), download: file.name, textContent: file.name });
          $('results').appendChild(document.createElement('li')).appendChild(a);
        }
        $('status').textContent = `${series.length} image(s), exit code ${exitCode}.`;
      } catch (e) {
        $('status').textContent = e.name === 'AbortError' ? 'Cancelled.' : `Failed: ${e.message}`;
      } finally {
        controller = null;
        $('cancel').disabled = true;
        $('folder').disabled = false;
      }
    }

    $('folder').onchange = () => run($('folder').files);
    $('cancel').onclick = () => controller && controller.abort();
    const drop = $('drop');
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = async (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      run(await filesFromDataTransfer(e.dataTransfer.items)); // read items before the handler returns
    };
  </script>
</body>
</html>
