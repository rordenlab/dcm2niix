<!DOCTYPE html>
<meta charset="utf-8">
<title>dcm2niix browser tests</title>
<script type="module">
  import * as dcm from '/js/dist/index.jpeg.js';
  // Fetch a fixture folder as Files, tagged like a webkitdirectory selection of that folder.
  async function load(dir) {
    const names = await (await fetch(`/${dir}/?list`)).json();
    const leaf = dir.split('/').pop();
    return Promise.all(names.map(async (name) => {
      const file = new File([await (await fetch(`/${dir}/${name}`)).blob()], name.split('/').pop());
      file._webkitRelativePath = `${leaf}/${name}`;
      return file;
    }));
  }
  const sha256 = async (blob) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()))].map((b) => b.toString(16).padStart(2, '0')).join('');
  Object.assign(window, { dcm, load, sha256 });
  window.ready = true;
</script>
